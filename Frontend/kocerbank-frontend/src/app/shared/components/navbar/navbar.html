<header class="admin-header">

  <div class="header-top">

    <!-- Sol taraf bilinçli olarak boş bırakılıyor -->
    <div class="header-spacer"></div>

    <!-- Ekranın tam ortasındaki logo -->
    <div class="bank-brand">
      <div class="bank-symbol">K</div>
      <div class="bank-name">KoçerBank</div>
    </div>

    <!-- Sağdaki personel bilgisi -->
    <div class="personel-menu">

      <button type="button"
              class="personel-info"
              [class.acik]="profilMenusuAcikMi"
              (click)="profilMenusunuDegistir()">

        <span class="personel-sicil">
          {{ sicilNo }} - {{ adSoyad }}
        </span>

        <div class="personel-icon">
          <span class="icon-head"></span>
          <span class="icon-body"></span>
        </div>

      </button>

      <div class="personel-menu-panel"
           [class.acik]="profilMenusuAcikMi">

        <a routerLink="/profil-duzenle"
           class="personel-menu-option"
           (click)="profilMenusunuKapat()">
          Profili Düzenle
        </a>

        <a routerLink="/sifre-degistir"
           class="personel-menu-option"
           (click)="profilMenusunuKapat()">
          Şifre Değiştir
        </a>

        <button type="button"
                class="personel-menu-option cikis-option"
                (click)="cikisYap()">
          Çıkış Yap
        </button>

      </div>

    </div>

  </div>

  <nav class="navigation">

    <a routerLink="/dashboard"
       routerLinkActive="active">
      <span class="menu-icon">◆</span>
      Dashboard
    </a>

    <a routerLink="/subeler"
       routerLinkActive="active">
      <span class="menu-icon">◆</span>
      Şubeler
    </a>

    <a routerLink="/personeller"
       routerLinkActive="active">
      <span class="menu-icon">◆</span>
      Personeller
    </a>

    <a routerLink="/musteriler"
       routerLinkActive="active">
      <span class="menu-icon">◆</span>
      Müşteriler
    </a>

    <!-- Hesap İşlemleri combo box menüsü: fare üstüne gelince açılır -->
    <div class="combo-menu">

      <button type="button"
              class="combo-menu-toggle">
        <span class="menu-icon">◆</span>
        Hesap İşlemleri
      </button>

      <div class="combo-menu-panel">

        <a routerLink="/para-cek-yatir"
           routerLinkActive="active"
           class="combo-menu-option">
          Para Çek/Yatır
        </a>

        <button type="button"
                class="combo-menu-option">
          Para Transferi
        </button>

      </div>

    </div>

  </nav>

</header>
